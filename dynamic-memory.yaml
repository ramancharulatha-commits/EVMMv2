apiVersion: v1
kind: Pod
metadata:
  name: dynamic-memory-test
  labels:
    app: dynamic-memory-test
spec:
  restartPolicy: Never
  containers:
    - name: memory-generator
      image: python:3.12-alpine
      command:
        - python3
        - -u
        - -c
        - |
          import time
          blocks = []
          sizes = [10, 20, 30, 40, 50, 40, 30, 20]
          while True:
              for size in sizes:
                  blocks.clear()
                  blocks.append(bytearray(size * 1024 * 1024))
                  print(f"Allocated approximately {size} MiB", flush=True)
                  time.sleep(20)
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 100Mi
